name: Build facehal

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      min_sdk:
        description: 'FACEHAL_MIN_SDK (needs 33+ for AImageReader usage fix)'
        default: '33'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r25c
      FACEHAL_MIN_SDK: ${{ inputs.min_sdk || '33' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Download Android NDK r27d
        run: |
          curl -sL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q ndk.zip
          ls android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++

      - name: Prefetch crates (warm offline cache)
        run: cd standalone-build && cargo fetch

      - name: Build production HAL
        env:
          ANDROID_SYSTEM_LIB64: ${{ github.workspace }}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/${{ inputs.min_sdk || '33' }}
          ANDROID_VENDOR_LIB64: ${{ github.workspace }}/ci/vendor-stub
        run: |
          LIBDIR=$(dirname $(find $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64 -name 'libclang.so' | head -1))
          echo "libclang dir: $LIBDIR"
          ls "$LIBDIR"/libclang.so
          export LIBCLANG_PATH="$LIBDIR"
          sh scripts/build-production.sh

      - name: Upload HAL binary
        uses: actions/upload-artifact@v4
        with:
          name: facehal-binary
          path: android.hardware.biometrics.face-service.facehal
